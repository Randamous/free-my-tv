name: Build Free My TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build and sign APK
        run: bash build.sh

      - name: Check generated package
        run: |
          test -s FreeMyTV.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          "$SDK/build-tools/34.0.0/apksigner" verify --verbose FreeMyTV.apk
          sha256sum FreeMyTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-APK
          path: FreeMyTV.apk
          if-no-files-found: error
          retention-days: 30
